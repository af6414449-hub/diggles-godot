<!DOCTYPE html>

<head>

<title>Diggles: гном — анимации</title>
<style>
  :root { color-scheme: dark; --bg: #0d0b09; --accent: #f0c674; --icon: clamp(38px, 3.9vw, 56px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: "Segoe UI", system-ui, sans-serif; }
  #view { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  #view:active { cursor: grabbing; }

  /* ---------- лента иконок внизу ---------- */
  #strip { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0;
    display: block;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    max-height: 44vh; overflow-y: auto; overflow-x: hidden;
    background: linear-gradient(to top, #0a0806 62%, rgba(10, 8, 6, 0));
    scrollbar-width: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  #strip::-webkit-scrollbar { display: none; }
  /* Ровно 13 кнопок в ряд: два симметричных ряда на широком экране,
     на узком — столько, сколько влезает, без выхода за края. */
  #icons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    width: 100%; max-width: calc(13 * var(--icon) + 120px); margin: 0 auto; }
  #strip button { flex: 0 0 auto; width: var(--icon); height: var(--icon); padding: 0;
    display: grid; place-items: center; border-radius: 10px;
    background: #2c2318; border: 1px solid #56462f; color: #cdbd9d; cursor: pointer;
    transition: background .14s, color .14s, border-color .14s, transform .14s; }
  #strip button svg { width: 62%; height: 62%; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* сплошные значки (ботинок) — заливка, чтобы форма читалась в мелком размере */
  #strip button svg [data-fill] { fill: currentColor; stroke: none; }
  @media (hover: hover) { #strip button:hover { background: #43331f; color: #ffeec9; transform: translateY(-2px); } }
  #strip button:active { transform: translateY(0); }
  #strip button.is-playing { background: #6b4923; color: #ffe0a2; border-color: #e0b66d; }
  #strip button.is-queued { border-color: #b89660; color: #efca8b; }
  #strip button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9; }
  #boot::after { content: ""; width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #3a2c1e; border-top-color: var(--accent); animation: spin .9s linear infinite; }
  body.err #boot::after { width: 30px; height: 30px; border-radius: 0; border: none; animation: none;
    background:
      linear-gradient(45deg, transparent 44%, #c9584a 44% 56%, transparent 56%),
      linear-gradient(-45deg, transparent 44%, #c9584a 44% 56%, transparent 56%); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<canvas id="view"></canvas>
<div id="boot"></div>

function reportError(where, error) {
  const text = where + ": " + (error && error.stack ? error.stack : String(error));
  window.__errors.push(text);
  console.error(text);
}
window.addEventListener("error", function (event) {
  reportError("window.onerror", event.error || event.message);
});

function svg(parts) {
  /* Разворачиваем вложенные массивы: иначе join склеит их запятыми-глифами. */
  const flat = [];
  for (const part of parts) {
    if (Array.isArray(part)) { for (const sub of part) flat.push(sub); }
    else flat.push(part);
  }
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + flat.join("") + '</svg>';
}

function decodeClips(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const view = new DataView(bytes.buffer);
  const decoder = new TextDecoder();
  let offset = 4;
  view.getUint32(offset, true); offset += 4;
  const clipCount = view.getUint32(offset, true); offset += 4;
  const clips = {};
  for (let c = 0; c < clipCount; c++) {
    const nameLen = view.getUint32(offset, true); offset += 4;
    const name = decoder.decode(bytes.subarray(offset, offset + nameLen)); offset += nameLen;
    const frameCount = view.getUint32(offset, true); offset += 4;
    const surfaceCount = view.getUint32(offset, true); offset += 4;
    const fps = view.getFloat32(offset, true); offset += 4;
    const scale = view.getFloat32(offset, true); offset += 4;
    const center = [view.getFloat32(offset, true), view.getFloat32(offset + 4, true),
                    view.getFloat32(offset + 8, true)];
    offset += 12;
    const height = view.getFloat32(offset, true); offset += 4;
    const surfaces = [];
    for (let s = 0; s < surfaceCount; s++) {
      const pointCount = view.getUint32(offset, true); offset += 4;
      const indexCount = view.getUint32(offset, true); offset += 4;
      const textureIndex = bytes[offset]; offset += 1;
      const indices = new Uint16Array(indexCount);
      for (let i = 0; i < indexCount; i++) { indices[i] = view.getUint16(offset, true); offset += 2; }
      surfaces.push({pointCount: pointCount, indexCount: indexCount,
                     textureIndex: textureIndex, indices: indices});
    }
    const frames = [];
    for (let f = 0; f < frameCount; f++) {
      const perSurface = [];
      for (const s of surfaces) {
        const positions = new Float32Array(s.pointCount * 3);
        for (let i = 0; i < s.pointCount * 3; i++) { positions[i] = view.getInt16(offset, true); offset += 2; }
        const uvs = new Float32Array(s.pointCount * 2);
        for (let i = 0; i < s.pointCount * 2; i++) { uvs[i] = view.getInt16(offset, true) / 32767.0; offset += 2; }
        const bright = new Uint8Array(s.pointCount);
        for (let i = 0; i < s.pointCount; i++) { bright[i] = bytes[offset + i]; }
        offset += s.pointCount;
        perSurface.push({positions: positions, uvs: uvs, bright: bright});
      }
      frames.push(perSurface);
    }
    clips[name] = {name: name, fps: fps, scale: scale, center: center, height: height,
                    frames: frames, surfaces: surfaces, frameCount: frameCount,
                    buffers: [], ebos: []};
  }
  return clips;
}
const CLIPS = decodeClips(CLIPS_B64);

/* ===================== математика ===================== */
function vsub(a, b) { return {x: a.x - b.x, y: a.y - b.y, z: a.z - b.z}; }
function vscale(a, s) { return {x: a.x * s, y: a.y * s, z: a.z * s}; }
function vlen(a) { return Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z); }
function vnorm(a) { const l = vlen(a); return l > 1e-9 ? vscale(a, 1.0 / l) : {x: 0, y: 0, z: 0}; }
function vdot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function vcross(a, b) { return {x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x}; }
function wrapAngle(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function mat4Multiply(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] +
                     a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
  }
  return o;
}
function mat4Perspective(fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy / 2.0);
  const o = new Float32Array(16);
  o[0] = f / aspect; o[5] = f; o[10] = (far + near) / (near - far); o[11] = -1.0;
  o[14] = 2.0 * far * near / (near - far);
  return o;
}
function mat4LookAt(eye, center, up) {
  const z = vnorm(vsub(eye, center));
  const x = vnorm(vcross(up, z));
  const y = vcross(z, x);
  const o = new Float32Array(16);
  o[0] = x.x; o[4] = x.y; o[8] = x.z; o[12] = -vdot(x, eye);
  o[1] = y.x; o[5] = y.y; o[9] = y.z; o[13] = -vdot(y, eye);
  o[2] = z.x; o[6] = z.y; o[10] = z.z; o[14] = -vdot(z, eye);
  o[15] = 1.0;
  return o;
}
/* Модель гнома: X — вправо, Y — вверх, Z — вперёд (как в исходной сборке). */
function dwarfMatrix(pos, heading, scale, center, height) {
  const c = Math.cos(heading), s = Math.sin(heading);
  const m = new Float32Array(16);
  m[0] = c * scale; m[1] = 0; m[2] = -s * scale;
  m[4] = 0; m[5] = scale; m[6] = 0;
  m[8] = s * scale; m[9] = 0; m[10] = c * scale;
  const ax = c * scale * center[0] + s * scale * center[2];
  const ay = scale * center[1];
  const az = -s * scale * center[0] + c * scale * center[2];
  m[12] = pos.x - ax;
  m[13] = pos.y - ay + scale * height * 0.5;
  m[14] = pos.z - az; m[15] = 1;
  return m;
}

function frameBuffer(clip, frameIndex, surfaceIndex) {
  if (clip.buffers[frameIndex] && clip.buffers[frameIndex][surfaceIndex]) {
    return clip.buffers[frameIndex][surfaceIndex];
  }
  const surface = clip.surfaces[surfaceIndex];
  const frame = clip.frames[frameIndex][surfaceIndex];
  const count = surface.pointCount;
  const data = new Float32Array(count * 8);
  for (let i = 0; i < count; i++) {
    data[i * 8 + 0] = frame.positions[i * 3 + 0];
    data[i * 8 + 1] = frame.positions[i * 3 + 1];
    data[i * 8 + 2] = frame.positions[i * 3 + 2];
    data[i * 8 + 3] = frame.uvs[i * 2 + 0];
    data[i * 8 + 4] = frame.uvs[i * 2 + 1];
    const normal = NORMAL_TABLE[frame.bright[i]] || [0, 1, 0];
    data[i * 8 + 5] = normal[0];
    data[i * 8 + 6] = -normal[1];
    data[i * 8 + 7] = normal[2];
  }
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  if (!clip.buffers[frameIndex]) clip.buffers[frameIndex] = [];
  clip.buffers[frameIndex][surfaceIndex] = vbo;
  return vbo;
}
function surfaceEbo(clip, surfaceIndex) {
  if (!clip.ebos[surfaceIndex]) {
    const ebo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, clip.surfaces[surfaceIndex].indices, gl.STATIC_DRAW);
    clip.ebos[surfaceIndex] = ebo;
  }
  return clip.ebos[surfaceIndex];
}

const scene = {pos: {x: 0, y: 0, z: 0}, heading: 0.0, clipName: "stand_anim_b", frame: 0};

/* ===================== проигрыватель ===================== */
/* Очередь анимаций (как у хомяка): клик во время проигрывания не прерывает текущую
   анимацию, а ставит новую в очередь — она стартует, когда текущая доиграет. */
const player = {queue: [], current: null, frame: 0, time: 0.0, repeatLeft: 1, activeId: null, finished: false,
                turn: null, exit: false};
const pendingQueue = [];
const IDLE_CLIP = "stand_anim_b";

/* Запуск последовательности клипов. exit: true — это «выход» из прерванной
   анимации (прыжок со стены, подъём после сна). */
function startSequence(seq, id, isExit) {
  player.queue = [];
  for (const entry of seq) {
    const count = entry[1];
    if (count === 0) {
      player.queue.push({clip: entry[0], repeat: Infinity});
    } else {
      for (let i = 0; i < count; i++) player.queue.push({clip: entry[0], repeat: 1});
    }
  }
  player.current = null;
  player.frame = 0;
  player.time = 0.0;
  player.finished = false;
  player.activeId = id;
  player.exit = !!isExit;
  player.turn = null;
  if (!isExit) {
    const found = ANIMATIONS.find(function (a) { return a.id === id; });
    if (found && found.turn) {
      /* Поворот: модель доворачивается на ходу клипа, а новое направление
         сохраняется после анимации. */
      player.turn = {angle: found.turn * Math.PI, clip: found.seq[0][0]};
    }
  }
  syncButtons();
}

function playAnimation(animation) {
  startSequence(animation.seq, animation.id, false);
}

/* Клик по иконке: если сейчас играет анимация — в очередь, иначе запустить сразу.
   Повторный клик по той же кнопке останавливает её или снимает из очереди. */
function requestAnimation(animation) {
  if (player.activeId === animation.id) {
    if (player.exit) { stopAnimation(); return; }
    if (animation.exit && animation.exit.length) {
      /* Прервать на стене — сначала спрыгнуть вниз, сна — сначала встать. */
      startSequence(animation.exit, animation.id, true);
      return;
    }
    stopAnimation();
    return;
  }
  const queuedAt = pendingQueue.indexOf(animation.id);
  if (queuedAt >= 0) {
    pendingQueue.splice(queuedAt, 1);
    syncButtons();
    return;
  }
  if (player.activeId) {
    pendingQueue.push(animation.id);
    syncButtons();
    return;
  }
  playAnimation(animation);
}

/* Остановка текущей анимации: дальше идёт следующая из очереди, иначе — простой. */
function stopAnimation() {
  player.finished = true;
  nextAnimation();
}

function updatePlayer(delta) {
  /* Анимация отыграла до конца — держим последний кадр, гном остаётся на экране. */
  if (player.finished) return;
  if (!player.current) {
    if (!player.queue.length) { nextAnimation(); return; }
    const next = player.queue.shift();
    player.current = next.clip;
    player.repeatLeft = next.repeat;
    player.frame = 0;
    player.time = 0.0;
  }
  const clip = CLIPS[player.current];
  if (!clip) { player.current = null; return; }
  player.time += delta;
  let frame = Math.floor(player.time * clip.fps);
  if (frame >= clip.frameCount) {
    if (player.repeatLeft > 1) {
      player.repeatLeft -= 1;
      player.time -= clip.frameCount / clip.fps;
      frame = Math.floor(player.time * clip.fps);
    } else if (player.repeatLeft === Infinity) {
      player.time -= clip.frameCount / clip.fps;
      frame = Math.floor(player.time * clip.fps);
    } else {
      if (player.queue.length) {
        player.current = null;          /* переходим к следующему клипу очереди */
      } else {
        player.finished = true;         /* очередь клипов кончилась */
      }
      frame = clip.frameCount - 1;
    }
  }
  player.frame = Math.max(0, Math.min(clip.frameCount - 1, frame));
  if (player.current) {
    /* Показываем только кадр того клипа, который реально играет. Между клипами
       держим последний показанный кадр: иначе проскакивал бы первый кадр
       предыдущей анимации (гном на мгновение «всплывал» на стену). */
    scene.clipName = player.current;
    scene.frame = player.frame;
  }
  if (player.finished) {
    /* Анимация доиграла до конца: поворот сохраняет новое направление,
       дальше гном продолжает смотреть туда же, куда повернулся. */
    if (player.turn) scene.heading += player.turn.angle;
    player.turn = null;
    nextAnimation();
  }
}

/* Текущая анимация доиграла: запускаем следующую из очереди, иначе возвращаемся к простою. */
function nextAnimation() {
  player.finished = false;
  player.exit = false;
  /* Кнопка циклической группы заменяется следующим вариантом после выполнения
     своей анимации (и после выхода из неё, если она была прервана). */
  if (player.activeId && advanceCycle(player.activeId)) syncButtons();
  if (pendingQueue.length) {
    const id = pendingQueue.shift();
    const found = ANIMATIONS.find(function (a) { return a.id === id; });
    if (found) { playAnimation(found); return; }
  }
  /* Очередь пуста — гном возвращается к спокойному простою и не исчезает. */
  player.activeId = null;
  player.turn = null;
  player.queue = [{clip: IDLE_CLIP, repeat: Infinity}];
  player.current = null;
  player.frame = 0;
  player.time = 0.0;
  syncButtons();
}

/* Текущая анимация кнопки: у циклической — вариант по позиции в схеме. */
function buttonAnim(button) {
  const cycle = CYCLE_GROUPS[button.dataset.anim];
  if (!cycle) return animById(button.dataset.anim);
  return animById(cycle[cyclePos[button.dataset.anim] % cycle.length]);
}
/* Кнопка циклической группы заменяется следующим вариантом, когда её
   анимация выполнена: ползти -> быстро -> копать в стену -> снова ползти. */
function advanceCycle(animId) {
  for (const group in CYCLE_GROUPS) {
    const cycle = CYCLE_GROUPS[group];
    const pos = cyclePos[group] % cycle.length;
    if (cycle[pos] !== animId) continue;
    cyclePos[group] = (pos + 1) % cycle.length;
    return true;
  }
  return false;
}
function buildStrip() {
  for (const entry of BUTTONS) {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.anim = entry.id;
    button.addEventListener("click", function () {
      paused = false;
      const anim = buttonAnim(button);
      if (anim) requestAnimation(anim);
    });
    iconRow.appendChild(button);
    buttons.push(button);
  }
  syncButtons();
}
function syncButtons() {
  for (const button of buttons) {
    const anim = buttonAnim(button);
    if (anim) {
      button.title = anim.label;
      button.setAttribute("aria-label", anim.label);
      button.innerHTML = svg(anim.icon);
    }
    const id = anim ? anim.id : "";
    button.classList.toggle("is-playing", id === player.activeId);
    button.classList.toggle("is-queued", pendingQueue.indexOf(id) >= 0);
  }
}

/* ===================== камера ===================== */
const pointers = new Map();
let yawVelocity = 0, pitchVelocity = 0, lastMoveTime = 0;
const clampPitch = function (v) { return Math.max(0.05, Math.min(1.4, v)); };
const clampDistance = function (v) { return Math.max(0.8, Math.min(20.0, v)); };
const stopOrbit = function () { yawVelocity = 0; pitchVelocity = 0; };
function pinchSpan() {
  const values = Array.from(pointers.values());
  return Math.max(1, Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y));
}
canvas.addEventListener("pointerdown", function (event) {
  if (event.pointerType === "mouse" && event.button !== 0) return;
  if (pointers.size >= 2) return;
  pointers.set(event.pointerId, {x: event.clientX, y: event.clientY, time: event.timeStamp});
  canvas.setPointerCapture(event.pointerId);
  stopOrbit();
  lastMoveTime = 0;
});
canvas.addEventListener("pointermove", function (event) {
  const prev = pointers.get(event.pointerId);
  if (!prev) return;
  const oldSpan = pointers.size === 2 ? pinchSpan() : 0;
  pointers.set(event.pointerId, {x: event.clientX, y: event.clientY, time: event.timeStamp});
  if (pointers.size === 2) {
    camera.distance = clampDistance(camera.distance * oldSpan / pinchSpan());
    stopOrbit();
    return;
  }
  const dyaw = -(event.clientX - prev.x) * 0.006;
  const dpitch = (event.clientY - prev.y) * 0.005;
  const oldPitch = camera.pitch;
  camera.yaw = wrapAngle(camera.yaw + dyaw);
  camera.pitch = clampPitch(camera.pitch + dpitch);
  const dt = Math.max(0.008, (event.timeStamp - prev.time) / 1000);
  const limit = function (v) { return Math.max(-2.6, Math.min(2.6, v)); };
  if (event.pointerType !== "mouse") {
    yawVelocity = limit(0.45 * yawVelocity + 0.55 * dyaw / dt);
    pitchVelocity = limit(0.45 * pitchVelocity + 0.55 * (camera.pitch - oldPitch) / dt);
  }
  lastMoveTime = event.timeStamp;
});
function endPointer(event) {
  if (!pointers.has(event.pointerId)) return;
  pointers.delete(event.pointerId);
  if (event.type !== "pointerup" || pointers.size || !lastMoveTime ||
      event.timeStamp - lastMoveTime > 80) stopOrbit();
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("lostpointercapture", endPointer);
window.addEventListener("blur", function () { pointers.clear(); stopOrbit(); });
function updateOrbit(delta) {
  if (pointers.size) return;
  const decay = Math.exp(-delta / 0.10);
  const step = 0.10 * (1 - decay);
  camera.yaw = wrapAngle(camera.yaw + yawVelocity * step);
  camera.pitch = clampPitch(camera.pitch + pitchVelocity * step);
  yawVelocity *= decay;
  pitchVelocity *= decay;
}
canvas.addEventListener("wheel", function (event) {
  event.preventDefault();
  camera.distance = clampDistance(camera.distance + event.deltaY * 0.008);
}, {passive: false});
window.addEventListener("keydown", function (event) {
  if (event.key === " ") paused = !paused;
  if (event.key === "f" || event.key === "F") {
    camera.yaw = -0.55; camera.pitch = 0.22; camera.distance = 2.0; scene.heading = 0.0;
  }
});

/* ===================== отрисовка ===================== */
/* Поворот во время клипа поворота: модель доворачивается от 0 до угла. */
function turnOffset() {
  if (!player.turn || player.current !== player.turn.clip) return 0.0;
  const clip = CLIPS[player.current];
  if (!clip || clip.frameCount < 2) return player.turn.angle;
  return player.turn.angle * (player.frame / (clip.frameCount - 1));
}

function drawDwarf(viewProjection) {
  const clip = CLIPS[scene.clipName];
  if (!clip) return;
  const frameIndex = Math.max(0, Math.min(clip.frameCount - 1, scene.frame));
  const matrix = dwarfMatrix(scene.pos, scene.heading + turnOffset(), clip.scale, clip.center, clip.height);
  const mvp = mat4Multiply(viewProjection, matrix);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(A.mvp, false, mvp);
  gl.uniformMatrix4fv(A.model, false, matrix);
  gl.uniform3f(A.tint, 1.0, 0.96, 0.9);
  gl.uniform3f(A.light, LIGHT_DIR.x, LIGHT_DIR.y, LIGHT_DIR.z);
  gl.uniform1f(A.ambient, 0.55);
  gl.enableVertexAttribArray(A.pos);
  gl.enableVertexAttribArray(A.uv);
  gl.enableVertexAttribArray(A.normal);
  for (let s = 0; s < clip.surfaces.length; s++) {
    const surface = clip.surfaces[s];
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textures[surface.textureIndex].handle);
    gl.uniform1i(A.tex, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, frameBuffer(clip, frameIndex, s));
    gl.vertexAttribPointer(A.pos, 3, gl.FLOAT, false, 32, 0);
    gl.vertexAttribPointer(A.uv, 2, gl.FLOAT, false, 32, 12);
    gl.vertexAttribPointer(A.normal, 3, gl.FLOAT, false, 32, 20);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, surfaceEbo(clip, s));
    gl.drawElements(gl.TRIANGLES, surface.indexCount, gl.UNSIGNED_SHORT, 0);
  }
}

/* Проецирует точку мира в NDC (x, y в диапазоне [-1, 1]). */
function projectNdc(mvp, x, y, z) {
  const w = mvp[3] * x + mvp[7] * y + mvp[11] * z + mvp[15];
  if (!(w > 1e-6)) return null;
  return {
    x: (mvp[0] * x + mvp[4] * y + mvp[8] * z + mvp[12]) / w,
    y: (mvp[1] * x + mvp[5] * y + mvp[9] * z + mvp[13]) / w
  };
}

function drawScene() {
  const width = canvas.width = Math.round(canvas.clientWidth * devicePixelRatio);
  const height = canvas.height = Math.round(canvas.clientHeight * devicePixelRatio);
  gl.viewport(0, 0, width, height);
  gl.clearColor(0.055, 0.048, 0.042, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  const target = camera.target;
  const eye = {
    x: target.x + Math.sin(camera.yaw) * Math.cos(camera.pitch) * camera.distance,
    y: target.y + Math.sin(camera.pitch) * camera.distance,
    z: target.z + Math.cos(camera.yaw) * Math.cos(camera.pitch) * camera.distance
  };
  const aspect = width / height;
  const fovy = Math.max(0.75, 2 * Math.atan(Math.tan(1.02 / 2) / aspect));
  const projection = mat4Perspective(fovy, aspect, 0.02, 100.0);
  const view = mat4LookAt(eye, target, {x: 0, y: 1, z: 0});
  /* Низ модели (y = 0) ставим на «пол» прямо над лентой иконок:
     гном всегда стоит над иконками, при любом размере окна. */
  const stripHeight = strip.offsetHeight;
  const marginPx = Math.max(36, Math.round(height * 0.11));
  const floorNdc = projectNdc(mat4Multiply(projection, view), scene.pos.x, 0, scene.pos.z);
  if (floorNdc) {
    const targetNdc = -1 + 2 * (stripHeight + marginPx) / height;
    projection[9] = floorNdc.y - targetNdc;
  }
  const viewProjection = mat4Multiply(projection, view);
  drawDwarf(viewProjection);
}

/* ===================== цикл ===================== */
let previous = performance.now();
function frame(now) {
  const delta = Math.min(0.05, (now - previous) / 1000.0);
  previous = now;
  try {
    if (!paused) updatePlayer(delta * speed);
    updateOrbit(delta);
    drawScene();
  } catch (error) {
    reportError("frame()", error);
    return;
  }
  requestAnimationFrame(frame);
}

/* ===================== старт ===================== */
buildStrip();
loadTextures().then(function () {
  document.getElementById("boot").style.display = "none";
  strip.inert = false;
  /* Стартуем со спокойного простоя: клик по иконке запускает анимацию сразу. */
  player.queue = [{clip: IDLE_CLIP, repeat: Infinity}];
  player.activeId = null;
  syncButtons();
  requestAnimationFrame(frame);
}).catch(function (error) {
  reportError("loadTextures()", error);
  document.body.classList.add("err");
});
</script>
